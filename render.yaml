# Render Blueprint — source of truth for web/worker env.
#
# Dashboard overrides WIN over this file:
# - If Start Command was customized, logs show bare `gunicorn ...` instead of
#   `[boot] starting gunicorn via run_web.py`. Fix Settings → Start Command.
# - If env keys already exist in Dashboard with different values (e.g.
#   GUNICORN_MAX_REQUESTS=0, DB_POOL_SIZE=30), Blueprint sync will NOT replace
#   them. Delete/correct those keys in Dashboard, then Sync / redeploy.
#
# After deploy, web Runtime startup profile must show:
#   run_generation_queue_worker=False
#   gunicorn_max_requests=0
#   runtime_diag_enabled=True

services:
  # Backend Service
  - type: web
    name: aistory-backend
    env: python
    region: oregon
    healthCheckPath: /healthz
    buildCommand: |
      cd backend
      pip install --no-cache-dir -r requirements.txt
    # MUST match Dashboard Start Command exactly (Dashboard wins if customized).
    # BAD (causes queue-in-web + max_requests=0 when env also wrong):
    #   cd backend; exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1 --timeout 600 --keep-alive 15
    # GOOD:
    startCommand: cd backend; python run_web.py
    envVars:
      # agentscope>=2 requires Python >=3.11; keep in sync with Docker/local (3.13).
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PYTHONUNBUFFERED
        value: "1"
      # Keep Dashboard-managed; do not regenerate on Blueprint sync (invalidates JWTs).
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 43200
      - key: FRONTEND_BASE_URL
        value: "https://aistory.pro"
      - key: CORS_ORIGINS
        value: "https://aistory.pro,https://www.aistory.pro,https://woola.fun,https://www.woola.fun,https://aistory-frontend.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: CORS_ALLOW_ORIGIN_REGEX
        value: "^https://.*\\.onrender\\.com$"
      - key: SECURITY_HEADERS_ENABLED
        value: "1"
      - key: SECURITY_HSTS_SECONDS
        value: "31536000"
      - key: GZIP_MINIMUM_SIZE
        value: "1024"
      # --- critical web process profile (do not override weaker in Dashboard) ---
      # 4GB-class hosts: single async worker; queue belongs on aistory-generation-worker.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: FORCE_SINGLE_WEB_WORKER
        value: "1"
      - key: RUN_GENERATION_QUEUE_WORKER_ON_START
        value: "0"
      - key: RUN_MAINTENANCE_SCHEDULER
        value: "1"
      # Persist under the uploads disk mount so redeploys do not wipe backups.
      - key: DB_BACKUP_DIR
        value: "uploads/_system_backups/db"
      - key: DB_BACKUP_KEEP_COUNT
        value: "7"
      - key: PROJECT_BACKUP_DIR
        value: "uploads/_system_backups/projects"
      - key: PROJECT_RETENTION_DAYS
        value: "60"
      - key: PROJECT_BACKUP_KEEP_DAYS
        value: "60"
      - key: PROJECT_RETENTION_REQUIRE_SOFT_DELETED
        value: "0"
      - key: BILLING_RECONCILE_ENABLED
        value: "1"
      - key: BILLING_RECONCILE_LOOKBACK_DAYS
        value: "3"
      - key: BILLING_RECONCILE_MAX_ROWS
        value: "500"
      # gunicorn: with WEB_CONCURRENCY=1, max-requests>0 causes a full outage on every
      # worker recycle (no spare worker). Prefer 0 + RUNTIME_DIAG_* for memory watch.
      # Dashboard overrides win — if you still see max-requests kills, set these to 0 there.
      - key: GUNICORN_TIMEOUT
        value: "600"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "660"
      - key: GUNICORN_KEEPALIVE
        value: "15"
      - key: GUNICORN_MAX_REQUESTS
        value: "0"
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: "0"
      # runtime diag: needed to catch OOM / high-watermark before Render SIGTERM.
      - key: RUNTIME_DIAG_LOG_ENABLED
        value: "1"
      - key: RUNTIME_DIAG_HEARTBEAT_ENABLED
        value: "1"
      - key: RUNTIME_DIAG_LOG_INTERVAL_SECONDS
        value: "30"
      - key: RUNTIME_DIAG_HIGH_WATERMARK_MB
        value: "900"
      - key: RUNTIME_DIAG_HIGH_WATERMARK_COOLDOWN_SECONDS
        value: "60"
      - key: RUNTIME_DIAG_STORE_SAMPLE_ITEMS
        value: "48"
      - key: RUNTIME_DIAG_TRACEMALLOC_ENABLED
        value: "0"
      - key: RUNTIME_DIAG_TRACEMALLOC_FRAMES
        value: "15"
      - key: RUNTIME_DIAG_TRACEMALLOC_TOP
        value: "8"
      - key: MP4_FASTSTART_MAX_MB
        value: "64"
      - key: LLM_TIMEOUT_SECONDS
        value: "300"
      - key: ANALYZE_SCENE_SEGMENT_TIMEOUT_SECONDS
        value: "300"
      - key: MEDIA_SUBMIT_CONNECT_TIMEOUT_SECONDS
        value: "15"
      - key: MEDIA_SUBMIT_IO_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_DEBUG_LOG
        value: "0"
      - key: LLM_DEBUG_LOG_CONTENT
        value: "0"
      - key: MEDIA_DEBUG_LOG
        value: "0"
      - key: IMAGE_JOB_TTL_SECONDS
        value: "600"
      - key: VIDEO_JOB_TTL_SECONDS
        value: "600"
      - key: IMAGE_JOB_MAX_ITEMS
        value: "80"
      - key: VIDEO_JOB_MAX_ITEMS
        value: "80"
      - key: GENERATION_JOB_STALE_DELETE_SECONDS
        value: "7200"
      - key: GENERATION_JOB_STALE_NON_TERMINAL_SECONDS
        value: "3600"
      - key: ASYNC_TASK_RESULT_TTL_SECONDS
        value: "300"
      - key: ASYNC_TASK_RESULT_MAX_BYTES
        value: "262144"
      - key: GENERATION_CALLBACK_TTL_SECONDS
        value: "1800"
      - key: GENERATION_CALLBACK_MAX_ITEMS
        value: "400"
      - key: GENERATION_CALLBACK_MAX_BYTES
        value: "16384"
      - key: GENERATION_CALLBACK_NO_MATCH_LOG_MAX_ITEMS
        value: "600"
      - key: GENERATION_CALLBACK_ASYNC_INFLIGHT_MAX_ITEMS
        value: "1200"
      - key: SYSTEM_API_CACHE_MAX_ROW_BYTES
        value: "32768"
      - key: WEBHOOK_REPLAY_MAX_ITEMS
        value: "2000"
      - key: REMOTE_IMAGE_LOCALIZE_MAX_MB
        value: "20"
      - key: ASSET_REMOTE_META_PROBE_MAX_BYTES
        value: "1048576"
      - key: ASSETS_LIST_MAX_SCAN_ROWS
        value: "3000"
      # Small pool on web: Dashboard DB_POOL_SIZE=30 + queue-in-web caused memory pressure.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "270"
      - key: DISABLE_DDG_HTML_SEARCH
        value: "1"
      - key: SERPER_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aistory-db
          property: connectionString
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1

  # Generation Queue Worker Service
  - type: worker
    name: aistory-generation-worker
    env: python
    region: oregon
    buildCommand: |
      cd backend
      pip install --no-cache-dir -r requirements.txt
    startCommand: |
      cd backend
      echo "[boot] generation worker starting"
      export RUN_DB_BOOTSTRAP_ON_START=0
      export RUN_GENERATION_QUEUE_WORKER_ON_START=1
      python -m app.generation_worker
    envVars:
      # agentscope>=2 requires Python >=3.11; keep in sync with Docker/local (3.13).
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RUN_DB_BOOTSTRAP_ON_START
        value: "0"
      # Only this service should run the generation queue.
      - key: RUN_GENERATION_QUEUE_WORKER_ON_START
        value: "1"
      - key: RUN_MAINTENANCE_SCHEDULER
        value: "0"
      - key: GENERATION_QUEUE_WORKER_THREADS
        value: "2"
      - key: MEDIA_SUBMIT_CONNECT_TIMEOUT_SECONDS
        value: "15"
      - key: MEDIA_SUBMIT_IO_TIMEOUT_SECONDS
        value: "60"
      - key: GUNICORN_TIMEOUT
        value: "600"
      - key: GUNICORN_GRACEFUL_TIMEOUT
        value: "660"
      - key: GUNICORN_KEEPALIVE
        value: "15"
      - key: GUNICORN_MAX_REQUESTS
        value: "300"
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: "50"
      - key: RUNTIME_DIAG_LOG_ENABLED
        value: "1"
      - key: RUNTIME_DIAG_HEARTBEAT_ENABLED
        value: "1"
      - key: RUNTIME_DIAG_LOG_INTERVAL_SECONDS
        value: "30"
      - key: RUNTIME_DIAG_HIGH_WATERMARK_MB
        value: "900"
      - key: RUNTIME_DIAG_HIGH_WATERMARK_COOLDOWN_SECONDS
        value: "60"
      - key: RUNTIME_DIAG_STORE_SAMPLE_ITEMS
        value: "48"
      - key: RUNTIME_DIAG_TRACEMALLOC_ENABLED
        value: "0"
      - key: RUNTIME_DIAG_TRACEMALLOC_FRAMES
        value: "15"
      - key: RUNTIME_DIAG_TRACEMALLOC_TOP
        value: "8"
      - key: IMAGE_JOB_TTL_SECONDS
        value: "600"
      - key: VIDEO_JOB_TTL_SECONDS
        value: "600"
      - key: IMAGE_JOB_MAX_ITEMS
        value: "80"
      - key: VIDEO_JOB_MAX_ITEMS
        value: "80"
      - key: GENERATION_JOB_STALE_DELETE_SECONDS
        value: "7200"
      - key: GENERATION_JOB_STALE_NON_TERMINAL_SECONDS
        value: "3600"
      - key: ASYNC_TASK_RESULT_TTL_SECONDS
        value: "300"
      - key: ASYNC_TASK_RESULT_MAX_BYTES
        value: "262144"
      - key: GENERATION_CALLBACK_TTL_SECONDS
        value: "1800"
      - key: GENERATION_CALLBACK_MAX_ITEMS
        value: "400"
      - key: GENERATION_CALLBACK_MAX_BYTES
        value: "16384"
      - key: GENERATION_CALLBACK_NO_MATCH_LOG_MAX_ITEMS
        value: "600"
      - key: GENERATION_CALLBACK_ASYNC_INFLIGHT_MAX_ITEMS
        value: "1200"
      - key: WEBHOOK_REPLAY_MAX_ITEMS
        value: "2000"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "270"
      - key: DATABASE_URL
        fromDatabase:
          name: aistory-db
          property: connectionString

  # Frontend Service
  - type: web
    name: aistory-frontend
    env: node
    buildCommand: |
      cd frontend
      npm ci --no-audit --no-fund
      npm run build
    startCommand: |
      cd frontend
      node server.mjs
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: VITE_PREFER_DIRECT_BACKEND
        value: "1"
      - key: VITE_ANALYZE_SCENE_SUBMIT_TIMEOUT_MS
        value: "300000"
      - key: VITE_MEDIA_SUBMIT_TIMEOUT_MS
        value: "120000"
      - key: BACKEND_PROXY_TARGET
        value: "https://aistory-backend-xggg.onrender.com"
      - key: BACKEND_PROXY_TIMEOUT_MS
        value: "610000"

databases:
  - name: aistory-db
    databaseName: aistory
    user: aistory_user
    region: oregon
    plan: free # Note: Free tier Postgres expires after 90 days on Render
