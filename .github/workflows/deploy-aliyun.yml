name: Dual Deploy CI/CD (Render + Alibaba Cloud Native ECS)

on:
  push:
    branches:
      - master  # 已经为您改为 master 分支

jobs:
  deploy-to-aliyun-ecs:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 3. Build Frontend & Prepare Archive
        run: |
          echo "--- Building Frontend ---"
          cd frontend
          npm config set registry https://registry.npmmirror.com/
          npm install
          npm run build
          cd ..
          
          echo "--- Zipping deployment files ---"
          # 排除不需要的本地环境和源码控制文件，将前后端全量打包
          tar --exclude='./frontend/node_modules' \
              --exclude='./.git' \
              --exclude='./backend/venv' \
              --exclude='./backend/.venv' \
              --exclude='./backend/__pycache__' \
              -czf /tmp/deploy.tar.gz .
          mv /tmp/deploy.tar.gz ./deploy.tar.gz

      - name: 4. Upload to Alibaba Cloud ECS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ALIYUN_ECS_IP }}
          username: root
          key: ${{ secrets.ALIYUN_ECS_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "/opt/AIStory"

      - name: 5. Execute Native Deployment Script on ECS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ALIYUN_ECS_IP }}
          username: root
          key: ${{ secrets.ALIYUN_ECS_PRIVATE_KEY }}
          script: |
            echo "--- Extracting files ---"
            cd /opt/AIStory
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            echo "--- Setting up Miniconda ---"
            # 如果上一次超时留下了损坏的目录，但没有 activate 文件，将其删除重装
            if [ ! -f "/opt/miniconda3/bin/activate" ]; then
              rm -rf /opt/miniconda3
              wget https://mirrors.tuna.tsinghua.edu.cn/anaconda/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
              bash miniconda.sh -b -p /opt/miniconda3
              rm miniconda.sh
            fi
            
            # 初始化conda并创建/激活隔离的环境
            source /opt/miniconda3/bin/activate
            
            # 配置 conda 国内清华镜像源加速下载
            conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/ || true
            conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free/ || true
            conda config --set show_channel_urls yes || true
            conda config --remove channels defaults || true
            conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main || true
            conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r || true
            
            conda create -y -n aistory python=3.13
            
            echo "--- Installing backend dependencies ---"
            # 使用环境绝对路径直接调用 pip，解决非交互式 bash 下 conda activate 失效的问题
            /opt/miniconda3/envs/aistory/bin/pip install --upgrade pip -i https://mirrors.aliyun.com/pypi/simple/
            /opt/miniconda3/envs/aistory/bin/pip install -r backend/requirements.txt -i https://mirrors.aliyun.com/pypi/simple/
            
            echo "--- Restarting Service ---"
            # 查找并强杀旧的 Uvicorn 进程
            pkill -f "uvicorn" || true
            
            cd backend
            export PORT=8000
            export PUBLIC_BASE_URL=http://${{ secrets.ALIYUN_ECS_IP }}:$PORT
            
            # 使用 Systemd 托管后台服务，一劳永逸解决所有 SSH 会话挂起和后台进程被杀问题
            cat << EOF > /etc/systemd/system/aistory-backend.service
[Unit]
Description=AIStory Backend FastAPI Service
After=network.target

[Service]
User=root
WorkingDirectory=/opt/AIStory/backend
Environment="PORT=$PORT"
Environment="PUBLIC_BASE_URL=$PUBLIC_BASE_URL"
ExecStart=/opt/miniconda3/envs/aistory/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT
Restart=always

[Install]
WantedBy=multi-user.target
EOF
            
            systemctl daemon-reload
            systemctl enable aistory-backend
            systemctl restart aistory-backend
            
            echo "--- Deployment successful! Service is running via systemd ---"
