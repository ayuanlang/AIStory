name: Dual Deploy CI/CD (Render + Alibaba Cloud Native ECS)

on:
  push:
    branches:
      - master  # 已经为您改为 master 分支

jobs:
  deploy-to-aliyun-ecs:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v3

      - name: 2. Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 3. Build Frontend & Prepare Archive
        run: |
          echo "--- Building Frontend ---"
          cd frontend
          npm config set registry https://registry.npmmirror.com/
          npm install
          npm run build
          cd ..
          
          echo "--- Zipping deployment files ---"
          # 排除不需要的本地环境和源码控制文件，将前后端全量打包
          tar --exclude='./frontend/node_modules' \
              --exclude='./.git' \
              --exclude='./backend/venv' \
              --exclude='./backend/.venv' \
              --exclude='./backend/__pycache__' \
              -czf /tmp/deploy.tar.gz .
          mv /tmp/deploy.tar.gz ./deploy.tar.gz

      - name: 4. Upload to Alibaba Cloud ECS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ALIYUN_ECS_IP }}
          username: root
          key: ${{ secrets.ALIYUN_ECS_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "/opt/AIStory"

      - name: 5. Execute Native Deployment Script on ECS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ALIYUN_ECS_IP }}
          username: root
          key: ${{ secrets.ALIYUN_ECS_PRIVATE_KEY }}
          script: |
            echo "--- Extracting files ---"
            cd /opt/AIStory
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            echo "--- Setting up Miniconda ---"
            # 如果上一次超时留下了损坏的目录，但没有 activate 文件，将其删除重装
            if [ ! -f "/opt/miniconda3/bin/activate" ]; then
              rm -rf /opt/miniconda3
              wget https://mirrors.tuna.tsinghua.edu.cn/anaconda/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
              bash miniconda.sh -b -p /opt/miniconda3
              rm miniconda.sh
            fi
            
            # 初始化conda并创建/激活隔离的环境
            source /opt/miniconda3/bin/activate
            
            # 配置 conda 国内清华镜像源加速下载
            conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/ || true
            conda config --add channels https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free/ || true
            conda config --set show_channel_urls yes || true
            
            conda create -y -n aistory python=3.13
            conda activate aistory
            
            echo "--- Installing backend dependencies ---"
            pip install --upgrade pip -i https://mirrors.aliyun.com/pypi/simple/
            pip install -r backend/requirements.txt -i https://mirrors.aliyun.com/pypi/simple/
            
            echo "--- Restarting Service ---"
            # 查找并强杀旧的 Uvicorn 进程
            pkill -f "uvicorn app.main:app" || true
            
            cd backend
            export PORT=8000
            export PUBLIC_BASE_URL=http://${{ secrets.ALIYUN_ECS_IP }}:$PORT
            
            # 完整重定向 stdin/stdout/stderr 避免 SSH 挂起导致 Github Actions 强行终止（143 错误）
            nohup conda run --no-capture-output -n aistory env PORT=$PORT PUBLIC_BASE_URL=$PUBLIC_BASE_URL uvicorn app.main:app --host 0.0.0.0 --port $PORT < /dev/null > ../server.log 2>&1 &
            
            sleep 3
            echo "--- Deployment successful! Service is running on port $PORT ---"
